name: Conquistador Render Worker
# Worker EPHEMERE : demarre, recupere les jobs video en attente, les fait
# avancer via le point d'entree EXISTANT (scripts/render-worker.js, qui
# reutilise src/core/videoOrchestrator.js — aucun orchestrateur parallele),
# puis S'ARRETE. Aucun keep-alive artificiel, aucune boucle while(true).
#
# Declenchement AUTOMATIQUE toutes les 5 heures (cron UTC) + declenchement
# manuel (workflow_dispatch) conserve. L'idempotence (videoJobs +
# claim/lock en base) empeche tout double traitement entre deux passages.

on:
  schedule:
    # Toutes les 5 heures : 00:00, 05:00, 10:00, 15:00, 20:00 UTC
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID d'un job precis a traiter jusqu'a completion (optionnel ; vide = file d'attente)"
        required: false
        type: string
      validate_only:
        description: "Syntaxe, dependances et tests seulement ; aucun service externe ni Worker"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Anti double-lancement : deux dispatches simultanes ne tournent jamais en
# parallele (l'idempotence cote code reste la seconde ligne de defense).
concurrency:
  group: conquistador-worker
  cancel-in-progress: false

jobs:
  render:
    name: Traitement des video_jobs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Seule la configuration non sensible est commune a toutes les etapes.
    # Les secrets sont limites aux commandes qui en ont besoin.
    env:
      IMAGE_IMG2IMG_PROVIDER: huggingface
      IMAGE_IMG2IMG_MODEL: black-forest-labs/FLUX.1-Kontext-dev
      VOICE_PROVIDER: edge-tts
      VOICE_NAME: Rémy Neural
      VOICE_STUDIO_TIMEOUT_MS: "20000"
      SUPABASE_MEDIA_BUCKET: conquistador-media
      KILL_SWITCH_DEFAULT: "false"
      CONQUISTADOR_DATA_DIR: /tmp/conquistador-data
    steps:
      - name: Checkout du depot
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Installation des dependances (reproductible)
        run: npm ci --no-audit --no-fund

      - name: Installation FFmpeg + ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verification prealable (syntaxe JavaScript + suite complete)
        run: |
          find src scripts netlify tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          npm test

      - name: Preflight des secrets Worker (aucune valeur affichee)
        id: worker-preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
          IMAGE_IMG2IMG_PROVIDER: huggingface
          WORKER_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only == true }}
        run: node scripts/worker-preflight.js

      - name: Etat du provider image-to-image (Hugging Face)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMAGE_IMG2IMG_PROVIDER: huggingface
          IMAGE_IMG2IMG_MODEL: black-forest-labs/FLUX.1-Kontext-dev
        run: |
          node -e "const s=require('./src/core/imageProviders/providerAdapter').status(); console.log(JSON.stringify({configured:s.configure,provider:s.provider,token_present:s.cle_detectee,model:s.modele}));"

      - name: Sante Voice Studio (externe, sortie assainie)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        env:
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
        run: |
          node -e "require('./src/core/voiceStudio').health().then(h=>{console.log(JSON.stringify({configured:h.configured,available:h.available,provider:h.provider,voice:h.voice})); if(!h.available) console.warn('Voice Studio indisponible; aucun detail de connexion n est journalise.');})"

      - name: Execution du worker (ephemere, un passage)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WORKER_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || '' }}
        run: |
          if [ -n "$WORKER_JOB_ID" ]; then
            node scripts/render-worker.js --job="$WORKER_JOB_ID"
          else
            node scripts/render-worker.js --once
          fi

      - name: Fin du runner
        if: always()
        run: echo "Worker termine (ephemere) — aucun processus ne reste actif."
