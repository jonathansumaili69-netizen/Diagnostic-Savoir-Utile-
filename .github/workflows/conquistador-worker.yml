name: Conquistador Render Worker
# Worker EPHEMERE : demarre, recupere les jobs video en attente, les fait
# avancer via le point d'entree EXISTANT (scripts/render-worker.js, qui
# reutilise src/core/videoOrchestrator.js — aucun orchestrateur parallele),
# puis S'ARRETE. Aucun keep-alive artificiel, aucune boucle while(true).
# Le backend Tiny-SD CPU utilise des poids publics, sans Inference Providers.

on:
  schedule:
    # Toutes les 5 heures : 00:00, 05:00, 10:00, 15:00, 20:00 UTC
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID d'un job precis a traiter jusqu'a completion (optionnel ; vide = file d'attente)"
        required: false
        type: string
      validate_only:
        description: "Syntaxe, dependances et tests seulement ; aucun service externe ni Worker"
        required: false
        type: boolean
        default: false
      voice_check_only:
        description: "Vérifier le endpoint vocal sans installer Tiny-SD ni lancer le Worker"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Anti double-lancement : deux dispatches simultanes ne tournent jamais en
# parallele (l'idempotence cote code reste la seconde ligne de defense).
concurrency:
  group: conquistador-worker
  cancel-in-progress: false

jobs:
  render:
    name: Traitement des video_jobs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Le profil strict n'autorise que Tiny-SD CPU sur poids publics.
    env:
      IMAGE_TEXT_TO_IMAGE_BACKEND: tiny_sd_cpu
      TINY_SD_CPU_WIDTH: "504"
      TINY_SD_CPU_HEIGHT: "896"
      TINY_SD_CPU_STEPS: "25"
      VOICE_PROVIDER: edge-tts
      VOICE_NAME: Rémy Neural
      VOICE_STUDIO_TIMEOUT_MS: "20000"
      SUPABASE_MEDIA_BUCKET: conquistador-media
      KILL_SWITCH_DEFAULT: "false"
      CONQUISTADOR_DATA_DIR: /tmp/conquistador-data

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12 pour Tiny-SD CPU
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.validate_only != true && inputs.voice_check_only != true) }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Runtime Tiny-SD CPU (poids publics, aucune API d'inference)
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.validate_only != true && inputs.voice_check_only != true) }}
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0+cpu'
          python -m pip install --disable-pip-version-check --no-cache-dir 'diffusers==0.32.2' 'transformers==4.51.3' 'accelerate==1.6.0' 'safetensors'
          python -c "import torch, diffusers, transformers; print('cpu_only=', not torch.cuda.is_available(), 'torch=', torch.__version__, 'diffusers=', diffusers.__version__, 'transformers=', transformers.__version__)"

      - name: Installation des dependances (reproductible)
        run: npm ci --no-audit --no-fund

      - name: Installation FFmpeg + ffprobe
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.voice_check_only != true }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Verification prealable (syntaxe JavaScript, Python + suite complete)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.voice_check_only != true }}
        run: |
          find src scripts netlify tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -m py_compile scripts/tiny_sd_cpu_generate.py
          npm test

      - name: Preflight des secrets Worker (aucune valeur affichee)
        id: worker-preflight
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
          IMAGE_IMG2IMG_PROVIDER: ""
          WORKER_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && (inputs.validate_only == true || inputs.voice_check_only == true) }}
        run: node scripts/worker-preflight.js

      - name: Etat du backend image selectionne (sortie assainie)
        run: |
          echo "backend=$IMAGE_TEXT_TO_IMAGE_BACKEND"
          node -e "console.log(JSON.stringify(require('./src/core/imageProviders/tinySdCpuProvider').status()))"

      - name: Sante Voice Studio (externe, sortie assainie)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.validate_only != true }}
        env:
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
        run: |
          node <<'NODE'
          const { health } = require('./src/core/voiceStudio');
          health().then((h) => {
            const endpoint = String(process.env.VOICE_STUDIO_API_URL || '');
            const rawReason = String(h.reason || '');
            const reason = endpoint ? rawReason.split(endpoint).join('[endpoint masqué]') : rawReason;
            console.log(JSON.stringify({ configured: h.configured, available: h.available, provider: h.provider, voice: h.voice, reason: reason || null }));
            if (!h.available) process.exitCode = 1;
          }).catch((error) => {
            const endpoint = String(process.env.VOICE_STUDIO_API_URL || '');
            const message = String(error.message || error);
            console.error(`Voice Studio health check failed: ${endpoint ? message.split(endpoint).join('[endpoint masqué]') : message}`);
            process.exitCode = 1;
          });
          NODE

      - name: Execution du worker (ephemere, un passage)
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.validate_only != true && inputs.voice_check_only != true) }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IMAGE_TEXT_TO_IMAGE_BACKEND: tiny_sd_cpu
          IMAGE_IMG2IMG_PROVIDER: ""
          TINY_SD_CPU_WIDTH: "504"
          TINY_SD_CPU_HEIGHT: "896"
          TINY_SD_CPU_STEPS: "25"
          VOICE_STUDIO_API_URL: ${{ secrets.VOICE_STUDIO_API_URL }}
          # Les clés de fournisseurs LLM payants ne sont volontairement pas transmises.
          WORKER_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.job_id || '' }}
        run: |
          if [ -n "$WORKER_JOB_ID" ]; then
            node scripts/render-worker.js --job="$WORKER_JOB_ID"
          else
            node scripts/render-worker.js --once
          fi

      - name: Fin du runner
        if: always()
        run: echo "Worker termine (ephemere) — aucun processus ne reste actif."
