# NOTE SUR LA PLANIFICATION (Scheduled Functions) :
# netlify/functions/report-daily-scheduled.js utilise le wrapper `schedule()` de
# @netlify/functions (plan Free compatible, limite les invocations mais suffisante
# pour 1 rapport/jour). Si ce mecanisme change chez Netlify, une alternative 100%
# gratuite et fiable consiste a appeler /api/report/daily depuis un declencheur
# externe gratuit (GitHub Actions cron, cron-job.org, ou un workflow n8n).
# Voir docs/ALTERNATIVES.md et docs/n8n-workflows/daily-report.json.

[dev]
  functions = "netlify/functions"
  publish = "public"
  port = 8888

[[redirects]]
  from = "/api/chariow/stats"
  to = "/.netlify/functions/chariow-stats"
  status = 200

[[redirects]]
  from = "/api/webhook/chariow"
  to = "/.netlify/functions/webhook-chariow"
  status = 200

[[redirects]]
  from = "/api/scheduler"
  to = "/.netlify/functions/scheduler-tick"
  status = 200
