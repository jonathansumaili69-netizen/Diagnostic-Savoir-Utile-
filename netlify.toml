[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Aucun build necessaire - fichiers statiques + fonctions Node'"

[functions]
  node_bundler = "esbuild"

# Pages publiques nécessaires aux portails développeur et aux utilisateurs.
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Redirections pour exposer une API propre /api/xxx qui pointe vers les fonctions Netlify.
# Cela permet de changer l'implementation interne sans casser les URLs publiques
# utilisees par n8n, le tableau de bord ou des services externes.

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/api/tasks"
  to = "/.netlify/functions/tasks"
  status = 200

[[redirects]]
  from = "/api/tasks/:id/run"
  to = "/.netlify/functions/task-run?id=:id"
  status = 200

[[redirects]]
  from = "/api/tasks/:id"
  to = "/.netlify/functions/task-get?id=:id"
  status = 200

